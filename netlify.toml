# Netlify configuration — headers live in public/_headers, redirects in public/_redirects.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify serves dist/404.html automatically for unknown paths (status 404).
# Pretty URLs: /about and /about/ both resolve to about/index.html.
[build.processing.html]
  pretty_urls = true
